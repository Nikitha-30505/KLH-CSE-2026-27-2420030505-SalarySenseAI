<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Salary Prediction | SalarySense AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header class="top-header">

    <div class="brand">
        <span class="brand-icon">📈</span>
        SalarySense AI
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/predict" class="active">Predict</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/about">About</a>
    </nav>

</header>


<main class="prediction-page">

    <div class="prediction-heading">

        <span class="small-label">AI SALARY ANALYZER</span>

        <h1>Predict Your Salary</h1>

        <p>
            Enter employee information and let our machine learning
            model estimate the expected annual salary.
        </p>

    </div>


    {% if error %}

    <div class="error-message">
        {{ error }}
    </div>

    {% endif %}


    <form action="/predict"
          method="POST"
          class="prediction-form">


        <!-- Age -->

        <div class="input-box">

            <label for="Age">
                Age
            </label>

            <input
                type="number"
                id="Age"
                name="Age"
                min="18"
                max="70"
                placeholder="Enter age"
                required>

        </div>


        <!-- Experience -->

        <div class="input-box">

            <label for="Years_of_Experience">
                Years of Experience
            </label>

            <input
                type="number"
                id="Years_of_Experience"
                name="Years_of_Experience"
                min="0"
                max="50"
                step="0.1"
                placeholder="Enter years of experience"
                required>

        </div>


        <!-- Gender -->

        <div class="input-box">

            <label for="Gender">
                Gender
            </label>

            <select
                id="Gender"
                name="Gender"
                required>

                <option value="">
                    Select Gender
                </option>

                {% for value in options["Gender"] %}

                <option value="{{ value }}">
                    {{ value }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- Education -->

        <div class="input-box">

            <label for="Education_Level">
                Education Level
            </label>

            <select
                id="Education_Level"
                name="Education_Level"
                required>

                <option value="">
                    Select Education Level
                </option>

                {% for value in options["Education_Level"] %}

                <option value="{{ value }}">
                    {{ value }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- Job Title -->

        <div class="input-box">

            <label for="Job_Title">
                Job Title
            </label>

            <select
                id="Job_Title"
                name="Job_Title"
                required>

                <option value="">
                    Select Job Title
                </option>

                {% for value in options["Job_Title"] %}

                <option value="{{ value }}">
                    {{ value }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- Industry -->

        <div class="input-box">

            <label for="Industry">
                Industry
            </label>

            <select
                id="Industry"
                name="Industry"
                required>

                <option value="">
                    Select Industry
                </option>

                {% for value in options["Industry"] %}

                <option value="{{ value }}">
                    {{ value }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- Location -->

        <div class="input-box">

            <label for="Location">
                Location
            </label>

            <select
                id="Location"
                name="Location"
                required>

                <option value="">
                    Select Location
                </option>

                {% for value in options["Location"] %}

                <option value="{{ value }}">
                    {{ value }}
                </option>

                {% endfor %}

            </select>

        </div>


        <!-- Company Size -->

        <div class="input-box">

            <label for="Company_Size">
                Company Size
            </label>

            <select
                id="Company_Size"
                name="Company_Size"
                required>

                <option value="">
                    Select Company Size
                </option>

                {% for value in options["Company_Size"] %}

                <option value="{{ value }}">
                    {{ value }}
                </option>

                {% endfor %}

            </select>

        </div>


        <button type="submit"
                class="predict-button">

            <span>✨</span>
            Predict Salary

        </button>

    </form>

</main>


<footer>

    <p>
        SalarySense AI • Machine Learning Based Salary Prediction
    </p>

</footer>


</body>
</html>
